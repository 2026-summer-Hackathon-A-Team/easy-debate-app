services:
  # frontendコンテナ(Nginxで静的配信)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:8080"
      - "443:8443" #本番ではHTTPS通信を行うため、ポート番号を変更
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/letsencrypt
    depends_on:
      - backend

  # backendコンテナ
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  # dbコンテナ
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: 'Asia/Tokyo'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 本番ではホストに直接公開しない(backendコンテナからのみアクセス)

volumes:
  mysql_data:
  certbot_conf:
  certbot_www: